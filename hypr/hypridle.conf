general {
    lock_cmd = pidof hyprlock || hyprlock       # dbus/sysd lock command
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after sleep
}

# 10 min (600s): Lock screen
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min (900s): Turn off screen (DPMS)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 min (1800s): Suspend system
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

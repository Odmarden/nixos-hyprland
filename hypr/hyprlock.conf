# ==============================================================================
# Tokyo Night Hyprlock Configuration
# ==============================================================================

background {
    monitor =
    path = /home/daniel/bilder/wallpapers/5816680-3840x2160-desktop-hd-cool-anime-background-image.jpg
    color = rgba(26, 27, 38, 1.0)

    # Blur background
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(192, 202, 245, 1.0)
    font_size = 70
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(122, 162, 247, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(122, 162, 247, 0.85) rgba(187, 154, 247, 0.85) 45deg
    inner_color = rgba(36, 40, 59, 0.9)
    font_color = rgb(192, 202, 245)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##565f89"><i>Lösenord...</i></span>
    hide_input = false
    rounding = 12
    check_color = rgba(158, 206, 106, 0.85)
    fail_color = rgba(247, 118, 142, 0.85)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgba(224, 175, 104, 0.85)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}
